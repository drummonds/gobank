version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...
      - cd cmd/demo && go fmt ./...
      - cd cmd/chartcompare && go fmt ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...
      - cd cmd/demo && go vet ./...
      - cd cmd/chartcompare && go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  bench:
    desc: Run benchmarks (in-memory SQLite)
    cmds:
      - go test -bench='^BenchmarkSimulation/' -benchmem -count=1 -timeout=600s ./...

  bench:file:
    desc: Run benchmarks with file-backed SQLite
    cmds:
      - go test -bench=BenchmarkSimulationFile -benchmem -count=1 -timeout=600s ./...

  bench:all:
    desc: Run all benchmarks (in-memory + file-backed)
    cmds:
      - go test -bench=. -benchmem -count=1 -timeout=600s ./...

  check:
    desc: Run fmt, vet, test, and rebuild pages
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: docs:gen
      - task: build:docs

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy
      - cd cmd/demo && go mod tidy
      - cd cmd/chartcompare && go mod tidy

  docs:gen:
    desc: Generate dist/index.html from project_data.json
    sources:
      - cmd/demo/project_data.json
      - cmd/gendocs/main.go
    generates:
      - dist/index.html
    cmds:
      - go run ./cmd/gendocs

  docs:md:
    desc: Convert README and CHANGELOG to HTML
    cmds:
      - mkdir -p dist
      - task-plus md2html --file README.md --dst dist
      - task-plus md2html --file CHANGELOG.md --dst dist

  docs:research:
    desc: Copy research HTML to dist
    cmds:
      - mkdir -p dist/research
      - cp research/*.html dist/research/

  boe:fetch:
    desc: Fetch BoE base rate history and write CSV
    cmds:
      - cd cmd/boefetch && go run . -o ../demo/boe_rates.csv

  demo:
    desc: Run the Model Bank demo locally (server mode)
    dir: cmd/demo
    vars:
      GIT_TAG:
        sh: '[ -n "{{.VERSION}}" ] && echo "{{.VERSION}}" || git describe --tags --always 2>/dev/null || echo dev'
    cmds:
      - go run -ldflags "-X main.version={{.GIT_TAG}}" .

  build:docs:
    desc: Build WASM demo and all pages into dist/
    vars:
      GIT_TAG:
        sh: '[ -n "{{.VERSION}}" ] && echo "{{.VERSION}}" || git describe --tags --always 2>/dev/null || echo dev'
    cmds:
      - mkdir -p dist/demo
      - cd cmd/demo && GOOS=js GOARCH=wasm go build -ldflags "-X main.version={{.GIT_TAG}}" -o main.wasm .
      - cp "$(find $(go env GOROOT) -name wasm_exec.js -print -quit)" dist/demo/
      - cp cmd/demo/main.wasm dist/demo/
      - sed 's/Model Bank WASM/Model Bank {{.GIT_TAG}}/' cmd/demo/templates/index.html > dist/demo/index.html
      - cp cmd/demo/templates/app.js dist/demo/
      - rm cmd/demo/main.wasm
      - task: docs:gen
      - task: docs:md
      - task: docs:research

  chartcompare:
    desc: Generate chart renderer comparison page
    dir: cmd/chartcompare
    cmds:
      - go run .

  serve:
    desc: Serve dist/ locally for testing WASM build
    cmds:
      - go run ./cmd/serve -dir dist -port 8000

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f cmd/demo/main.wasm cmd/demo/wasm_exec.js
      - rm -rf dist
