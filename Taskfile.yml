version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...
      - cd cmd/demo && go fmt ./...
      - cd cmd/chartcompare && go fmt ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...
      - cd cmd/demo && go vet ./...
      - cd cmd/chartcompare && go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  bench:
    desc: Run quick benchmarks (1K-10K accounts)
    dir: cmd/demo
    cmds:
      - go test -run=^$ -bench='^BenchmarkFullYear/(1000|10000)$' -benchmem -count=1 -timeout=600s -v .

  bench:create:
    desc: Benchmark account creation (all sizes)
    dir: cmd/demo
    cmds:
      - go test -run=^$ -bench='^BenchmarkCreateAccounts/' -benchmem -count=1 -timeout=3600s -v .

  bench:sim:
    desc: Benchmark 1-year simulation (all sizes)
    dir: cmd/demo
    cmds:
      - go test -run=^$ -bench='^BenchmarkSimulateYear/' -benchmem -count=1 -timeout=86400s -v .

  bench:full:
    desc: Run full year benchmarks (all sizes)
    dir: cmd/demo
    cmds:
      - go test -run=^$ -bench='^BenchmarkFullYear/' -benchmem -count=1 -timeout=86400s -v .

  bench:all:
    desc: Run all benchmarks
    dir: cmd/demo
    cmds:
      - go test -run=^$ -bench=. -benchmem -count=1 -timeout=86400s -v .

  check:
    desc: Run fmt, vet, test, and rebuild pages
    cmds:
      - task: fmt
      - task: diagrams
      - task: vet
      - task: test
      - task: docs:build

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy
      - cd cmd/demo && go mod tidy
      - cd cmd/chartcompare && go mod tidy

  docs:gen:
    desc: Generate docs/index.html from project_data.json
    sources:
      - cmd/demo/project_data.json
      - cmd/gendocs/main.go
    generates:
      - docs/index.html
    cmds:
      - go run ./cmd/gendocs

  docs:md:
    desc: Convert markdown and d2 diagrams to HTML/SVG
    cmds:
      - mkdir -p docs
      - task-plus md2html --file README.md --dst docs
      - task-plus md2html --file CHANGELOG.md --dst docs
      - task-plus md2html --file ROADMAP.md --dst docs
      - d2 roadmap.d2 docs/roadmap.svg

  docs:research:
    desc: Copy research HTML to docs
    cmds:
      - mkdir -p docs/research
      - cp research/*.html docs/research/

  diagrams:
    desc: Render d2 architecture diagrams to SVG
    cmds:
      - d2 cmd/demo/diagrams/system_context.d2 cmd/demo/diagrams/system_context.svg
      - d2 cmd/demo/diagrams/container.d2 cmd/demo/diagrams/container.svg

  docs:build:
    desc: Build WASM demo and all pages into docs/
    vars:
      GIT_TAG:
        sh: '[ -n "{{.VERSION}}" ] && echo "{{.VERSION}}" || git describe --tags --always 2>/dev/null || echo dev'
    cmds:
      - task: diagrams
      - mkdir -p docs/demo
      - cd cmd/demo && GOOS=js GOARCH=wasm go build -ldflags "-X main.version={{.GIT_TAG}}" -o main.wasm .
      - cp "$(find $(go env GOROOT) -name wasm_exec.js -print -quit)" docs/demo/
      - cp cmd/demo/main.wasm docs/demo/
      - sed 's/Model Bank WASM/Model Bank {{.GIT_TAG}}/' cmd/demo/templates/index.html > docs/demo/index.html
      - cp cmd/demo/templates/app.js docs/demo/
      - rm cmd/demo/main.wasm
      - task: docs:gen
      - task: docs:md
      - task: docs:research

  boe:fetch:
    desc: Fetch BoE base rate history and write CSV
    cmds:
      - cd cmd/boefetch && go run . -o ../demo/boe_rates.csv

  demo:
    desc: Run the Model Bank demo locally (server mode)
    dir: cmd/demo
    vars:
      GIT_TAG:
        sh: '[ -n "{{.VERSION}}" ] && echo "{{.VERSION}}" || git describe --tags --always 2>/dev/null || echo dev'
    cmds:
      - go run -ldflags "-X main.version={{.GIT_TAG}}" .

  chartcompare:
    desc: Generate chart renderer comparison page
    dir: cmd/chartcompare
    cmds:
      - go run .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f cmd/demo/main.wasm cmd/demo/wasm_exec.js
      - rm -rf docs
