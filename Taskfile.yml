version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -count=1 -timeout=600s ./...

  check:
    desc: Run fmt, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  release:
    desc: 'Release a new version, eg: task release VERSION=v0.1.0 COMMENT="initial release"'
    requires:
      vars: [VERSION, COMMENT]
    cmds:
      - task: check
      - git add .
      - git commit -am "{{.COMMENT}}"
      - git tag "{{.VERSION}}"
      - git push origin "{{.VERSION}}"
      - git push
