version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...
      - cd cmd/demo && go fmt ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...
      - cd cmd/demo && go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -count=1 -timeout=600s ./...

  check:
    desc: Run fmt, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy
      - cd cmd/demo && go mod tidy

  docs:build:
    desc: Render mermaid diagrams to SVG (requires mmdg)
    dir: cmd/demo/diagrams
    sources:
      - '*.mmd'
    generates:
      - '*.svg'
    cmds:
      - for f in *.mmd; do mmdg -i "$f" -o "${f%.mmd}.svg" -e svg; done

  demo:
    desc: Run the Model Bank demo locally (server mode)
    deps: [docs:build]
    dir: cmd/demo
    cmds:
      - go run .

  build-pages:
    desc: Build WASM demo for GitHub Pages docs/ folder
    deps: [docs:build]
    cmds:
      - mkdir -p docs/demo
      - cd cmd/demo && GOOS=js GOARCH=wasm go build -o main.wasm .
      - cp "$(find $(go env GOROOT) -name wasm_exec.js -print -quit)" docs/demo/
      - cp cmd/demo/main.wasm docs/demo/
      - cp cmd/demo/templates/index.html docs/demo/
      - cp cmd/demo/templates/app.js docs/demo/
      - rm cmd/demo/main.wasm

  serve:
    desc: Serve docs/ locally for testing WASM build
    cmds:
      - go run ./cmd/serve -dir docs -port 8000

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f cmd/demo/main.wasm cmd/demo/wasm_exec.js
      - rm -f docs/demo/main.wasm docs/demo/wasm_exec.js

